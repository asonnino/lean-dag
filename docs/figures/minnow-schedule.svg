<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" font-family="Helvetica,Arial,sans-serif">
<rect width="1180" height="620" fill="#ffffff"/>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<text x="24" y="40" font-size="17" fill="#111">The same DAG, two leader schedules</text>
<text x="24" y="64" font-size="13" fill="#666">The Byzantine habit does not change: every vertex process 0 issues reaches process 1 alone, and sits in the dead zone at two pointers of four.</text>
<text x="24" y="124" font-size="14" fill="#111">round robin, two leaders a round — the schedule of the section above</text>
<text x="210" y="142" font-size="12" fill="#555" text-anchor="middle">round 0</text>
<rect x="154" y="150" width="112" height="30" rx="7" fill="#f8d7da" stroke="#c62828" stroke-width="1.6"/>
<text x="210" y="170" font-size="13" fill="#c62828" text-anchor="middle">(0,0)</text>
<rect x="154" y="186" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="210" y="206" font-size="13" fill="#999999" text-anchor="middle">(1,0)</text>
<text x="362" y="142" font-size="12" fill="#555" text-anchor="middle">round 1</text>
<rect x="306" y="150" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="362" y="170" font-size="13" fill="#999999" text-anchor="middle">(2,1)</text>
<rect x="306" y="186" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="362" y="206" font-size="13" fill="#999999" text-anchor="middle">(3,1)</text>
<text x="514" y="142" font-size="12" fill="#555" text-anchor="middle">round 2</text>
<rect x="458" y="150" width="112" height="30" rx="7" fill="#f8d7da" stroke="#c62828" stroke-width="1.6"/>
<text x="514" y="170" font-size="13" fill="#c62828" text-anchor="middle">(0,2)</text>
<rect x="458" y="186" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="514" y="206" font-size="13" fill="#999999" text-anchor="middle">(1,2)</text>
<text x="666" y="142" font-size="12" fill="#555" text-anchor="middle">round 3</text>
<rect x="610" y="150" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="666" y="170" font-size="13" fill="#999999" text-anchor="middle">(2,3)</text>
<rect x="610" y="186" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="666" y="206" font-size="13" fill="#999999" text-anchor="middle">(3,3)</text>
<text x="818" y="142" font-size="12" fill="#555" text-anchor="middle">round 4</text>
<rect x="762" y="150" width="112" height="30" rx="7" fill="#f8d7da" stroke="#c62828" stroke-width="1.6"/>
<text x="818" y="170" font-size="13" fill="#c62828" text-anchor="middle">(0,4)</text>
<rect x="762" y="186" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="818" y="206" font-size="13" fill="#999999" text-anchor="middle">(1,4)</text>
<text x="970" y="142" font-size="12" fill="#555" text-anchor="middle">round 5</text>
<rect x="914" y="150" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="970" y="170" font-size="13" fill="#999999" text-anchor="middle">(2,5)</text>
<rect x="914" y="186" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="970" y="206" font-size="13" fill="#999999" text-anchor="middle">(3,5)</text>
<text x="24" y="246" font-size="13" fill="#c62828">Not one of the ten leader slots commits. Each round carries a fresh dead slot or sits directly above one.</text>
<text x="24" y="274" font-size="14" fill="#111">round robin, one leader a round</text>
<text x="210" y="292" font-size="12" fill="#555" text-anchor="middle">round 0</text>
<rect x="154" y="300" width="112" height="30" rx="7" fill="#f8d7da" stroke="#c62828" stroke-width="1.6"/>
<text x="210" y="320" font-size="13" fill="#c62828" text-anchor="middle">(0,0)</text>
<text x="362" y="292" font-size="12" fill="#555" text-anchor="middle">round 1</text>
<rect x="306" y="300" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="362" y="320" font-size="13" fill="#999999" text-anchor="middle">(2,1)</text>
<text x="514" y="292" font-size="12" fill="#555" text-anchor="middle">round 2</text>
<rect x="458" y="300" width="112" height="30" rx="7" fill="#e8f4ea" stroke="#2e7d32" stroke-width="1.6"/>
<text x="514" y="320" font-size="13" fill="#2e7d32" text-anchor="middle">(3,2)</text>
<text x="666" y="292" font-size="12" fill="#555" text-anchor="middle">round 3</text>
<rect x="610" y="300" width="112" height="30" rx="7" fill="#e8f4ea" stroke="#2e7d32" stroke-width="1.6"/>
<text x="666" y="320" font-size="13" fill="#2e7d32" text-anchor="middle">(1,3)</text>
<text x="818" y="292" font-size="12" fill="#555" text-anchor="middle">round 4</text>
<rect x="762" y="300" width="112" height="30" rx="7" fill="#f8d7da" stroke="#c62828" stroke-width="1.6"/>
<text x="818" y="320" font-size="13" fill="#c62828" text-anchor="middle">(0,4)</text>
<text x="970" y="292" font-size="12" fill="#555" text-anchor="middle">round 5</text>
<rect x="914" y="300" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="970" y="320" font-size="13" fill="#999999" text-anchor="middle">(2,5)</text>
<text x="24" y="360" font-size="13" fill="#2e7d32">The round after a dead slot is blocked; the two after that commit, and are checked to.</text>
<rect x="14" y="394" width="112" height="30" rx="7" fill="#f8d7da" stroke="#c62828" stroke-width="1.6"/>
<text x="70" y="414" font-size="13" fill="#c62828" text-anchor="middle"></text>
<text x="140" y="414" font-size="13" fill="#111">the Byzantine process leads: two pointers, neither committable nor skippable, and decided in no view</text>
<rect x="14" y="430" width="112" height="30" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
<text x="70" y="450" font-size="13" fill="#999999" text-anchor="middle"></text>
<text x="140" y="450" font-size="13" fill="#111">a correct leader that does not hold the dead vertex, and cannot skip it either</text>
<rect x="14" y="466" width="112" height="30" rx="7" fill="#e8f4ea" stroke="#2e7d32" stroke-width="1.6"/>
<text x="70" y="486" font-size="13" fill="#2e7d32" text-anchor="middle"></text>
<text x="140" y="486" font-size="13" fill="#111">a correct leader two rounds above the dead slot, which has it in its causal past</text>
<text x="24" y="542" font-size="13" fill="#111">A dead slot is out of reach for exactly two rounds of leaders — its own, where there is no causal path either way, and the one above, whose leaders</text>
<text x="24" y="562" font-size="13" fill="#111">need not hold it. From two rounds up it lies in every causal past, because it has f + 1 pointers and a vertex misses at most f of the round below.</text>
<text x="24" y="582" font-size="13" fill="#111">So a schedule offering two consecutive rounds of correct leaders commits at the second. Round robin at l = 1 always offers one: f faulty processes cut</text>
<text x="24" y="602" font-size="13" fill="#111">the cycle into at most f runs of the 2f + 1 correct, so some run has three. At l = 2 or more an adversary can meet every such window with the f it has.</text>
</svg>
