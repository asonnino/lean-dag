<text x="24" y="44" font-size="17" fill="#111">Two reliable validators, two delivered sequences</text>
<text x="24" y="68" font-size="13" fill="#666">Blocks are drawn in the order each validator ab-delivers them. Boxes group the blocks emitted by one invocation of commit.</text>
