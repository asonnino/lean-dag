<path d="M481,272 C481,346 700,366 700,436" fill="none" stroke="#e65100" stroke-width="2.6" stroke-dasharray="6,5" marker-end="url(#mo)"/>
<path d="M700,272 C700,346 335,366 335,436" fill="none" stroke="#00695c" stroke-width="2.6" stroke-dasharray="6,5" marker-end="url(#mt)"/>
<text x="700" y="530" font-size="13" fill="#e65100" text-anchor="middle">5 arrives late</text>
<text x="335" y="530" font-size="13" fill="#00695c" text-anchor="middle">7 arrives early</text>
<rect x="18" y="130" width="553.1999999999999" height="22" fill="#ffffff"/>
<text x="24" y="146" font-size="15" fill="#111">first validator — commits 8 at delivery(4), then 19 at delivery(6)</text>
<rect x="18" y="152" width="428.0" height="19" fill="#ffffff"/>
<text x="24" y="166" font-size="12" fill="#777">delivery(4) emits the first two boxes; delivery(6) emits the rest</text>
<rect x="18" y="370" width="528.5999999999999" height="22" fill="#ffffff"/>
<text x="24" y="386" font-size="15" fill="#111">second validator — delivery(4) fails, commits 19 at delivery(6)</text>
<rect x="18" y="392" width="472.8" height="19" fill="#ffffff"/>
<text x="24" y="406" font-size="12" fill="#777">a single invocation, descending 19 → 12 → 7 → 3 before emitting anything</text>
<rect x="586.6" y="278" width="300.8" height="19" fill="#ffffff"/>
<text x="737" y="292" font-size="12" fill="#c62828" text-anchor="middle">commit(12) emits nothing — 12 is dropped by L27</text>
<circle cx="90" cy="568" r="8" fill="none" stroke="#e65100" stroke-width="2.6"/>
<text x="112" y="572" font-size="13" fill="#333">block 5 — created by validator 1, which is reliable; no twin, so L27's filter never examines it</text>
<circle cx="90" cy="594" r="8" fill="none" stroke="#00695c" stroke-width="2.6"/>
<text x="112" y="598" font-size="13" fill="#333">block 7 — created by validator 3, which is reliable, and the anchor of round 1; likewise no twin</text>
<circle cx="84" cy="620" r="8" fill="#dff0d8" stroke="#bbbbbb" stroke-width="1.2"/>
<circle cx="102" cy="620" r="8" fill="#f8d7da" stroke="#bbbbbb" stroke-width="1.2"/>
<text x="112" y="624" font-size="13" fill="#333">block 8 and block 12 — the equivocator's twins. The first validator delivers 8 and the second 12, which is the Agreement failure</text>
<text x="90" y="668" font-size="13" fill="#111">The first validator delivers 5 before 7 and the second 7 before 5, so Definition 1's Total order fails. What orders them is which</text>
<text x="90" y="688" font-size="13" fill="#111">segment they fall in: 5 lies in the cone of 8 and 7 in the cone of 12, so each validator takes one of them with the twin it committed</text>
<text x="90" y="708" font-size="13" fill="#111">and the other only later. Neither block is a twin and neither is authored by the equivocator, so no rule for choosing among twins</text>
<text x="90" y="728" font-size="13" fill="#111">repairs this — only a rule that makes the two descents agree, which is what no validator can run from its own view.</text>
</svg>
