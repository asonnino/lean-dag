<text x="919" y="481" font-size="14" fill="#222" text-anchor="middle">11</text>
<circle cx="992" cy="476" r="20" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
<text x="992" y="481" font-size="14" fill="#222" text-anchor="middle">13</text>
