<text x="756" y="188" font-size="12" fill="#2e7d32" text-anchor="start">points to 0</text>
<text x="756" y="234" font-size="12" fill="#c62828" text-anchor="start">does not</text>
<text x="756" y="280" font-size="12" fill="#c62828" text-anchor="start">does not</text>
<text x="756" y="317" font-size="12" fill="#2e7d32" text-anchor="start">points to 0</text>
<text x="756" y="399" font-size="12" fill="#2e7d32" text-anchor="start">points to 0</text>
<text x="756" y="481" font-size="12" fill="#c62828" text-anchor="start">does not</text>
<text x="280" y="148" font-size="12" fill="#111" text-anchor="middle">the vertex in question</text>
<line x1="28" y1="540" x2="66" y2="540" stroke="#2e7d32" stroke-width="2.6"/>
<text x="78" y="544" font-size="13" fill="#111">Quorum: processes {0, 1, 2} have a pointing vertex — three of four, so 2f + 1. The clause holds.</text>
<line x1="28" y1="564" x2="66" y2="564" stroke="#c62828" stroke-width="2.6"/>
<text x="78" y="568" font-size="13" fill="#111">Skip: vertices 5, 6 and 9 carry no edge to it — three vertices, so 2f + 1. The clause holds too.</text>
<line x1="28" y1="588" x2="66" y2="588" stroke="#111" stroke-width="2.6"/>
<text x="78" y="592" font-size="13" fill="#111">Counting the skip by process instead gives {3} alone, one of four, and the two clauses stop competing.</text>
<text x="28" y="634" font-size="13" fill="#111">So one process may commit the slot while another skips it, and the rule sanctions both. A round holds n vertices only while nobody equivocates.</text>
</svg>
