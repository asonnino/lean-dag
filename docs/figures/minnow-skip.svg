<text x="24" y="40" font-size="17" fill="#111">One vertex, committed and skipped at the same time</text>
<text x="24" y="64" font-size="13" fill="#666">The quorum clause counts processes; the skip clause counts vertices. An equivocator's spare vertices count only for the second.</text>
<text x="280" y="112" font-size="14" fill="#555" text-anchor="middle">round 0</text>
<text x="700" y="112" font-size="14" fill="#555" text-anchor="middle">round 1</text>
<text x="170" y="235" font-size="12" fill="#c62828">p0 (faulty)</text>
<text x="170" y="317" font-size="12" fill="#999">p1</text>
<text x="170" y="399" font-size="12" fill="#999">p2</text>
<text x="170" y="481" font-size="12" fill="#999">p3</text>
