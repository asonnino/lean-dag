<circle cx="40" cy="494" r="9" fill="none" stroke="#1565c0" stroke-width="1.6"/>
<text x="60" y="498" font-size="13" fill="#111">a leader slot under round robin, two a round</text>
<text x="24" y="528" font-size="13" fill="#111">Every vertex of process 0 is pointed to by exactly two processes: itself and process 1, the only one it sent to. Committing needs three, and</text>
<text x="24" y="548" font-size="13" fill="#111">skipping needs three non-pointers, of which there are two. So the slot is neither, and no later vertex can change the count — the round is full.</text>
<text x="24" y="568" font-size="13" fill="#111">Round robin then does the rest. The other leader of the same round is concurrent with the dead slot, so the causal-past escape is unavailable;</text>
<text x="24" y="588" font-size="13" fill="#111">and the next round's leaders are processes 2 and 3, the two that never received the vertex. Only from two rounds up does it enter every causal</text>
<text x="24" y="608" font-size="13" fill="#111">past, and by then process 0 leads again. All ten leaders below are checked individually: not one of them commits.</text>
</svg>
