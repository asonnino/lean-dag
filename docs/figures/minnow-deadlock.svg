<text x="24" y="40" font-size="17" fill="#111">A DAG in which crs* commits nothing, ever</text>
<text x="24" y="64" font-size="13" fill="#666">Process 0 sends each of its vertices to process 1 alone. Two processes then point to it: too few to commit, too many to skip.</text>
<text x="220" y="124" font-size="14" fill="#555" text-anchor="middle">round 0</text>
<text x="220" y="142" font-size="11" fill="#1565c0" text-anchor="middle">leaders (0,0) then (1,0)</text>
<text x="388" y="124" font-size="14" fill="#555" text-anchor="middle">round 1</text>
<text x="388" y="142" font-size="11" fill="#1565c0" text-anchor="middle">leaders (2,1) then (3,1)</text>
<text x="556" y="124" font-size="14" fill="#555" text-anchor="middle">round 2</text>
<text x="556" y="142" font-size="11" fill="#1565c0" text-anchor="middle">leaders (0,2) then (1,2)</text>
<text x="724" y="124" font-size="14" fill="#555" text-anchor="middle">round 3</text>
<text x="724" y="142" font-size="11" fill="#1565c0" text-anchor="middle">leaders (2,3) then (3,3)</text>
<text x="892" y="124" font-size="14" fill="#555" text-anchor="middle">round 4</text>
<text x="892" y="142" font-size="11" fill="#1565c0" text-anchor="middle">leaders (0,4) then (1,4)</text>
<text x="1060" y="124" font-size="14" fill="#555" text-anchor="middle">round 5</text>
<text x="1060" y="142" font-size="11" fill="#1565c0" text-anchor="middle">leaders (2,5) then (3,5)</text>
