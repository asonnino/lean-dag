<text x="130" y="639" font-size="13" fill="#333">support for 8, and 14 links it: 8 is committed by the rule</text>
<line x1="66" y1="660" x2="118" y2="660" stroke="#c62828" stroke-width="2.6"/>
<text x="130" y="665" font-size="13" fill="#333">support for 12: one validator, so the rule never admits it</text>
<line x1="66" y1="686" x2="118" y2="686" stroke="#1565c0" stroke-width="2.6"/>
<text x="130" y="691" font-size="13" fill="#333">the references of the round-4 anchor 19</text>
<line x1="66" y1="712" x2="118" y2="712" stroke="#c62828" stroke-width="2.6" stroke-dasharray="7,5"/>
<text x="130" y="717" font-size="13" fill="#333">the reference 19 does not carry — 3 of 4 suffice, so this is legal</text>
<line x1="66" y1="738" x2="118" y2="738" stroke="#6a1b9a" stroke-width="2.6" stroke-dasharray="2,6"/>
<text x="130" y="743" font-size="13" fill="#333">the descent of commit(19): no round-3 anchor in its cone, so it skips round 3 and meets both twins</text>
<text x="66" y="780" font-size="13" fill="#111">The first validator commits 8 at round 2 and outputs it. The second times out at round 4, so its commit attempt there fails, and</text>
<text x="66" y="800" font-size="13" fill="#111">the protocol never retries a round; it commits 19 at round 6 instead, whose descent takes 12 — L24 prefers it, one round from the</text>
<text x="66" y="820" font-size="13" fill="#111">nearest anchor of its own cone against two for 8. Each then bars the other's block: that author and round has already gone out.</text>
