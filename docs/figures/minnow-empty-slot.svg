<text x="60" y="516" font-size="13" fill="#111">a leader slot under round robin, two a round</text>
<text x="24" y="564" font-size="13" fill="#111">Rounds still advance: a round completes on n − f = 3 vertices, and the three correct processes supply them. Every vertex they issue</text>
<text x="24" y="584" font-size="13" fill="#111">carries a quorum. But the second clause of Φ*s asks that "there is a vertex v′ in slot s′ in D such that …", and for slot (0,0) there is</text>
<text x="24" y="604" font-size="13" fill="#111">none: nothing to reach, nothing to commit, nothing to skip. So every leader after the first empty slot is blocked, for ever.</text>
