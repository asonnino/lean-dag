<text x="24" y="40" font-size="17" fill="#111">A silent leader blocks every later leader</text>
<text x="24" y="64" font-size="13" fill="#666">Process 0 issues nothing, so slots (0, r) hold no vertex at all — and Definition 9 asks for one.</text>
