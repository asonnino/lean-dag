<rect x="426.8" y="263" width="326.4" height="18" fill="#ffffff"/>
<text x="590" y="276" font-size="12" fill="#e65100" text-anchor="middle">the round-1 leader — it points to the other twin</text>
<circle cx="40" cy="544" r="9" fill="none" stroke="#1565c0" stroke-width="1.6"/>
<text x="60" y="548" font-size="13" fill="#111">a leader slot — one a round, by round robin</text>
<circle cx="40" cy="570" r="9" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.3"/>
<text x="60" y="574" font-size="13" fill="#111">held by the whole DAG but not by the view considered below</text>
<text x="24" y="598" font-size="13" fill="#111">The view is missing vertex 5, one of the three that point to the committed twin, and vertex 12, the only one that references 5. It is</text>
<text x="24" y="618" font-size="13" fill="#111">reference-closed and valid. In it the twin 0 has two pointers, one short of a quorum, and one process not pointing at it, two short of a skip:</text>
<text x="24" y="638" font-size="13" fill="#111">it is undecided. But slot (0,0) is resolved all the same, because the other twin lies in the round-1 leader's causal past — and resolving a slot is</text>
<text x="24" y="658" font-size="13" fill="#111">not deciding it. So the round-1 leader commits with an earlier leader slot undecided, and vertex 5 then arrives and gives the twin its quorum.</text>
<text x="24" y="678" font-size="13" fill="#111">Safe-Commit asks that a leader disabled when a later one commits stay disabled. Here it does not, and the equivocation is what makes the difference:</text>
<text x="24" y="698" font-size="13" fill="#111">without a second vertex in the slot there is nothing to resolve it with, and the round-1 leader is blocked instead.</text>
</svg>
