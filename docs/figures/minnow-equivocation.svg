<text x="924" y="477" font-size="11" fill="#777" text-anchor="start">missing from the view</text>
<rect x="191.4" y="170" width="197.2" height="18" fill="#ffffff"/>
<text x="290" y="183" font-size="12" fill="#e65100" text-anchor="middle">one pointer — never committed</text>
<rect x="198.2" y="256" width="183.6" height="18" fill="#ffffff"/>
<text x="290" y="269" font-size="12" fill="#2e7d32" text-anchor="middle">quorum of three — committed</text>
<circle cx="290" cy="232" r="25" fill="none" stroke="#1565c0" stroke-width="1.6"/>
<circle cx="290" cy="146" r="25" fill="none" stroke="#1565c0" stroke-width="1.6"/>
