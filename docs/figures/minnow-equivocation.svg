<text x="24" y="40" font-size="17" fill="#111">One twin resolves a slot, the other commits it</text>
<text x="24" y="64" font-size="13" fill="#666">The second condition is satisfied by some vertex of an earlier slot. Where the slot's process equivocates, that need not be the vertex which is later committed.</text>
